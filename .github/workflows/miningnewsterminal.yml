name: closeology-miningnewsterminal

# Pulls the public MiningNewsTerminal drill feed (/api/v1/drills) into the drill
# bank. Standalone (not coupled to the crawler) so a long backfill can never be
# starved by, or starve, the wire crawl. Incremental a few times daily; a 24-month
# backfill on demand via workflow_dispatch (mode=backfill).
on:
  schedule:
    - cron: "20 6,12,18,0 * * *"   # 4x/day incremental (UTC), offset from the crawler
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental or backfill"
        default: "incremental"

concurrency:
  group: closeology-miningnewsterminal
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Pull the MiningNewsTerminal drill feed
        run: PYTHONPATH=src python -m newswire.miningnewsterminal "${{ github.event.inputs.mode || 'incremental' }}" --max-seconds 4200
      - name: Commit the bank
        run: |
          git config user.name "closeology-bot"
          git config user.email "actions@github.com"
          git pull --no-edit -X ours origin main || true
          git add -A data/keep 2>/dev/null || true
          git reset -q -- 'data/keep/*_claims_snapshot.parquet' 'data/keep/*_boundary.parquet' 'data/keep/*_minfile_facts.parquet' 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main || true
            git stash -q 2>/dev/null || true
            git reset -q --hard origin/main
            git stash pop -q 2>/dev/null || true
            git add -A data/keep 2>/dev/null || true
            git reset -q -- 'data/keep/*_claims_snapshot.parquet' 'data/keep/*_boundary.parquet' 'data/keep/*_minfile_facts.parquet' 2>/dev/null || true
            git diff --cached --quiet && { echo "no new drill data"; break; }
            git fetch -q origin main 2>/dev/null || true; git checkout -q origin/main -- site 2>/dev/null || true
            git commit -q -m "MiningNewsTerminal feed refresh $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push origin HEAD:main && break || { echo "retry $i"; sleep 5; }
          done
