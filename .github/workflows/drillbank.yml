name: closeology-drillbank

# Fills the shared drill-and-assay bank (data/keep/drillbank.sqlite) from the
# mining newswires. Runs on its OWN schedule and its OWN runner IPs, gently
# paced, so the wires' datacenter rate-limiting can't starve it and it can never
# stall the site build. The daily site build renders drill_radar.html from
# whatever is banked here.
on:
  schedule:
    - cron: "0 */6 * * *"        # every 6 hours
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental or backfill"
        default: "incremental"
      limit:
        description: "max releases this run"
        default: "300"

concurrency:
  group: closeology-drillbank
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      NEWSWIRE_MAX_SECONDS: "1500"   # gentle 25-min budget
      NEWSWIRE_DELAY: "6"            # ~6s between releases -> under the throttle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Collect drill results
        run: |
          PYTHONPATH=src python -m newswire.run "${{ github.event.inputs.mode || 'incremental' }}" --limit "${{ github.event.inputs.limit || 300 }}"
          PYTHONPATH=src python -m newswire.run stats
          PYTHONPATH=src python -m minemodelingpro.export
      - name: Commit the bank
        run: |
          git config user.name "closeology-bot"
          git config user.email "actions@github.com"
          git pull --no-edit -X ours origin main || true
          git add -A data/keep 2>/dev/null || true
          git commit -m "Drill bank refresh $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" || echo "no new drill data"
          git push || echo "nothing to push"
