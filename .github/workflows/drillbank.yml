name: closeology-drillbank

# Best-effort requests-based crawl of the mining newswires into the drill bank.
# Collects via newsfile's per-industry RSS feeds + sequential release-id walk.
# The RSS feeds (feeds.newsfilecorp.com) and bare /release/<id> pages ARE
# datacenter-reachable, so this runs reliably on GitHub runners with no
# dependence on Jordan's Mac. Scheduled a few times daily (incremental) plus
# on-demand backfill.
on:
  schedule:
    - cron: "35 5,11,17,23 * * *"   # 4x/day incremental catch-up (UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental or backfill"
        default: "incremental"
      limit:
        description: "max releases this run"
        default: "8000"

concurrency:
  group: closeology-drillbank
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      NEWSWIRE_MAX_SECONDS: "20400"  # ~5.7h — run until the crawl is exhausted, not a fixed budget
      NEWSWIRE_DELAY: "3"            # 3s pacing; curl_cffi handles any 429 with backoff
      NEWSWIRE_PER_SOURCE: "100000" # no per-source cap — take everything each wire has
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Collect drill results
        run: |
          PYTHONPATH=src python -m newswire.run "${{ github.event.inputs.mode || 'incremental' }}" --limit "${{ github.event.inputs.limit || 8000 }}"
          PYTHONPATH=src python -m newswire.run stats
          PYTHONPATH=src python -m minemodelingpro.export
      - name: Commit the bank
        run: |
          git config user.name "closeology-bot"
          git config user.email "actions@github.com"
          git pull --no-edit -X ours origin main || true
          # commit ONLY the drill bank + SEDAR data; the jurisdiction claim
          # fabric (*_claims_snapshot / *_boundary / *_minfile_facts) is owned by
          # the full build — never let a fast drill-bank push clobber it back.
          git add -A data/keep 2>/dev/null || true
          git reset -q -- 'data/keep/*_claims_snapshot.parquet' 'data/keep/*_boundary.parquet' 'data/keep/*_minfile_facts.parquet' 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main || true
            git stash -q 2>/dev/null || true
            git reset -q --hard origin/main
            git stash pop -q 2>/dev/null || true
            git add -A data/keep 2>/dev/null || true
            git reset -q -- 'data/keep/*_claims_snapshot.parquet' 'data/keep/*_boundary.parquet' 'data/keep/*_minfile_facts.parquet' 2>/dev/null || true
            git diff --cached --quiet && { echo "no new drill data"; break; }
            git fetch -q origin main 2>/dev/null || true; git checkout -q origin/main -- site 2>/dev/null || true  # never carry site/ backward — the daily build owns it
            git commit -q -m "Drill bank refresh $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push origin HEAD:main && break || { echo "retry $i"; sleep 5; }
          done
