name: closeology-daily

# Fully automatic once this repo exists on GitHub: rebuilds BC + Ontario from
# public data every morning and commits the refreshed site back to the repo.
on:
  schedule:
    - cron: "17 12 * * *"      # daily 12:17 UTC (~05:17 PT)
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: closeology-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System deps (Access DB reader for MINFILE facts)
        run: sudo apt-get update -q && sudo apt-get install -y -q mdbtools
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Rebuild BC + Ontario (fetch live data, screen, render)
        run: PYTHONPATH=src python src/build_all.py
      - name: Commit refreshed site
        run: |
          git config user.name "closeology-bot"
          git config user.email "actions@github.com"
          git add -A site data/keep 2>/dev/null || true
          git commit -m "Daily rebuild $(date -u +%Y-%m-%d)" || echo "no changes"
          git push || echo "nothing to push"

  # OPTIONAL public site: uncomment to serve site/ at username.github.io/closeology
