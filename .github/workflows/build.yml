name: closeology-daily

# Rebuilds BC + Ontario + Yukon from public data every morning and publishes
# the site to GitHub Pages (public URL) automatically.
on:
  schedule:
    - cron: "17 12 * * *"      # daily 12:17 UTC (~05:17 PT)
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: closeology
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System deps
        run: sudo apt-get update -q && sudo apt-get install -y -q mdbtools
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Rebuild BC + Ontario + Yukon
        run: PYTHONPATH=src python src/build_all.py
      - name: Commit refreshed site
        run: |
          git config user.name "closeology-bot"
          git config user.email "actions@github.com"
          git add -A site data/keep 2>/dev/null || true
          git commit -m "Daily rebuild $(date -u +%Y-%m-%d)" || echo "no changes"
          git push || echo "nothing to push"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
