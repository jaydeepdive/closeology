name: closeology-daily

# Rebuilds every Canadian jurisdiction (BC, ON, YK, NL, SK, MB, NT, NB, NS, AB, QC)
# from public data every morning and publishes the site to GitHub Pages automatically.
on:
  schedule:
    - cron: "17 12 * * *"      # daily 12:17 UTC (~05:17 PT) — the ONE full data rebuild
  workflow_dispatch: {}
# NOTE: no `push` trigger — code/model/site pushes publish via deploy.yml (fast,
# ~1 min, no rebuild). The heavy all-jurisdiction rebuild runs only on the daily
# schedule, when the public source data actually changes.

concurrency:
  group: closeology
  cancel-in-progress: false      # queue rebuilds instead of cancelling the one that's deploying

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System deps
        run: sudo apt-get update -q && sudo apt-get install -y -q mdbtools
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Rebuild all Canadian jurisdictions
        run: PYTHONPATH=src python src/build_all.py
      - name: Build 3D deposit models
        run: |
          pip install -q numpy pandas pyarrow 2>/dev/null || true
          PYTHONPATH=src python -m minemodelingpro.ceo_sedar --sync --ingest || echo "ceo 43-101 ingest skipped"
          PYTHONPATH=src python -c "from minemodelingpro import model3d; model3d.build_all('site')" || echo "model build skipped"
      - name: Commit refreshed site
        run: |
          git config user.name "closeology-bot"
          git config user.email "actions@github.com"
          # The full build regenerates site/ + data/keep wholesale and is slow, so
          # drillbank/collector commits often land mid-build. Rebase the generated
          # files onto the LATEST origin tip each attempt (reset --soft keeps our
          # files, moves the base) so every push is a clean fast-forward; retry
          # through races. This is why an earlier fix kept getting lost.
          ok=0
          for i in $(seq 1 8); do
            git fetch -q origin main || true
            git reset --soft origin/main
            git add -A site data/keep 2>/dev/null || true
            if git diff --cached --quiet; then echo "no changes"; ok=1; break; fi
            git commit -q -m "Daily rebuild $(date -u +%Y-%m-%d) [skip ci]"
            if git push origin HEAD:main; then echo "pushed on try $i"; ok=1; break; fi
            echo "push race, retry $i"; sleep $((RANDOM % 6 + 4))
          done
          [ "$ok" = 1 ] || echo "WARNING: build commit did not land"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
