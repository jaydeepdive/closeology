name: closeology-daily

# Rebuilds every Canadian jurisdiction (BC, ON, YK, NL, SK, MB, NT, NB, NS, AB, QC)
# from public data every morning and publishes the site to GitHub Pages automatically.
on:
  schedule:
    - cron: "17 12 * * *"      # daily 12:17 UTC (~05:17 PT) — the ONE full data rebuild
  workflow_dispatch: {}
# NOTE: no `push` trigger — code/model/site pushes publish via deploy.yml (fast,
# ~1 min, no rebuild). The heavy all-jurisdiction rebuild runs only on the daily
# schedule, when the public source data actually changes.

concurrency:
  group: closeology
  cancel-in-progress: true       # a newer rebuild supersedes queued/older ones so the latest code deploys promptly (was false, which let dispatches pile into a multi-hour serial backlog)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System deps
        run: sudo apt-get update -q && sudo apt-get install -y -q mdbtools
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Rebuild all Canadian jurisdictions
        run: PYTHONPATH=src python src/build_all.py
      - name: Commit refreshed site
        run: |
          git config user.name "closeology-bot"
          git config user.email "actions@github.com"
          # The full build regenerates site/ + data/keep wholesale and is slow, so
          # drillbank/collector AND source-code commits often land mid-build.
          # Re-point onto the LATEST origin tip each attempt with a MIXED reset so
          # the index matches origin/main for ALL paths; then stage ONLY the
          # generated files. (A --soft reset kept the stale index from this build's
          # original checkout and committed it, silently reverting any src/ change
          # pushed mid-build — that is why earlier fixes kept getting lost.)
          ok=0
          for i in $(seq 1 8); do
            git fetch -q origin main || true
            git reset -q origin/main            # MIXED: index + HEAD -> origin tip, keep worktree
            git add -A site data/keep 2>/dev/null || true
            if git diff --cached --quiet; then echo "no changes"; ok=1; break; fi
            git commit -q -m "Daily rebuild $(date -u +%Y-%m-%d) [skip ci]"
            if git push origin HEAD:main; then echo "pushed on try $i"; ok=1; break; fi
            echo "push race, retry $i"; sleep $((RANDOM % 6 + 4))
          done
          [ "$ok" = 1 ] || echo "WARNING: build commit did not land"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
