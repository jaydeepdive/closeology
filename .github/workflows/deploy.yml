name: deploy-pages-fast
# Deploys the already-committed site/ to GitHub Pages in ~1 min, without the
# heavy multi-jurisdiction rebuild in build.yml. Keeps model/site changes from
# waiting 30-60 min behind a full data rebuild. build.yml still rebuilds data
# and deploys its own [skip ci] commits; this handles ordinary pushes.
on:
  push:
    branches: [main]
    # only when something that is actually served changes. Pushes that touch only
    # pipeline code (src/, tools/, workflows) have nothing to deploy -- the next
    # build.yml run rebuilds and deploys the site -- and a pointless Pages deploy
    # racing the build's own deploy is what timed out on 2026-11-09.
    paths:
      - 'site/**'
      - 'api_static/**'
permissions:
  pages: write
  id-token: write
  contents: read
concurrency:
  group: pages-fast
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Attach claims API (rebuilt daily on the api-data branch)
        continue-on-error: true          # never block the site deploy
        run: |
          mkdir -p site/api
          if git fetch -q --depth=1 origin api-data; then git archive FETCH_HEAD | tar -x -C site/api; else echo "no api-data branch yet"; fi
          cp -r api_static/. site/api/   # docs/examples from main are always the latest
          ls site/api site/api/v1 2>/dev/null | head -20
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: dep
        uses: actions/deploy-pages@v4
