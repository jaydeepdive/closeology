<style>
:root{ --red:#D71920; --ink:#111418; --mut:#636363; --line:#e6e8eb; --panel:#f5f7fa; --bg:#ffffff; --chip:#EDF2F7; }
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Roboto',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.55;}
h1,h2,h3,h4{font-family:'Bitter',Georgia,serif;font-weight:700;color:var(--ink);margin:0;}
a{color:var(--red);text-decoration:none;} a:hover{text-decoration:underline;}
.topbar{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:50;}
.topwrap{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 22px;gap:20px;flex-wrap:wrap;}
.brand{display:flex;flex-direction:column;gap:3px;text-decoration:none;}
.brand img{height:30px;width:auto;display:block;}
.brand .sub{font-family:'Bitter',serif;font-weight:700;font-size:11px;letter-spacing:2.5px;color:var(--ink);text-transform:uppercase;}
nav.menu{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
nav.menu a,nav.menu .dd>a.ddlabel{display:inline-flex;align-items:center;height:32px;color:var(--ink);font-size:14px;font-weight:500;line-height:1;border-bottom:2px solid transparent;text-decoration:none;}
nav.menu a:hover{color:var(--red);text-decoration:none;}
nav.menu a.active{color:var(--red);border-bottom-color:var(--red);}
nav.menu .dd{position:relative;display:inline-flex;align-items:center;}
nav.menu .dd>a.ddlabel::after{content:"";display:inline-block;width:0;height:0;margin-left:6px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--mut);}
nav.menu .dd:hover>a.ddlabel::after{border-top-color:var(--red);}
nav.menu .dd:hover>a.ddlabel,nav.menu .dd>a.ddlabel.active{color:var(--red);}
nav.menu .dd-menu{display:none;position:absolute;top:100%;left:0;padding-top:8px;min-width:230px;z-index:60;}
nav.menu .dd:hover .dd-menu{display:block;}
nav.menu .dd-menu .inner{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.10);padding:6px 0;}
nav.menu .dd-menu a{display:block;padding:7px 15px;font-size:13.5px;color:var(--ink);border:0;white-space:nowrap;}
nav.menu .dd-menu a:hover{background:var(--panel);color:var(--red);text-decoration:none;}
.wrap{max-width:1180px;margin:0 auto;padding:26px 22px 60px;}
.hero h1{font-size:30px;letter-spacing:-.3px;} .hero p{color:var(--mut);max-width:760px;}
.rule{height:3px;width:52px;background:var(--red);margin:10px 0 0;border-radius:2px;}
footer.site{border-top:1px solid var(--line);color:var(--mut);font-size:12px;line-height:1.6;padding:22px;max-width:1180px;margin:0 auto;}
footer.site b{color:var(--ink);}

html,body{height:100%;} body{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
#app{display:flex;flex:1;min-height:0;}
#map{flex:1;height:100%;}
#side{width:420px;max-width:44vw;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
.filters{padding:11px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.filters .fsel{display:flex;flex-direction:column;gap:4px;} .filters .fsel.wide{grid-column:1/3;}
.filters label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:700;}
.filters input,.filters select{height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:#fff;color:var(--ink);}
.filters input[type=range]{height:auto;padding:0;border:0;}
.cnt{padding:7px 14px;color:var(--mut);font-size:12.5px;border-bottom:1px solid var(--line);}
#list{flex:1;overflow:auto;}
.row{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:baseline;}
.row:hover{background:var(--panel);} .row.sel{background:#fdeaea;}
.row .sc{font-family:'Bitter',serif;font-weight:800;color:var(--red);min-width:26px;}
.row .nm{font-weight:600;font-size:13.5px;} .row .mt{color:var(--mut);font-size:11.5px;margin-top:2px;}
.jp{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:10px;background:var(--chip);color:#333;margin-left:5px;}
/* detail panel */
#detail{flex:1;overflow:auto;display:none;}
.dback{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:9px 14px;font-size:13px;font-weight:600;color:var(--red);cursor:pointer;z-index:2;}
.dhd{padding:14px 16px 6px;} .dhd .dn{font-family:'Bitter',serif;font-weight:800;font-size:20px;line-height:1.1;}
.dhd .dsub{color:var(--mut);font-size:12.5px;margin-top:3px;}
.pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle;}
.p-open{background:#e7f6ec;color:#127a3a;} .p-hard{background:#fff4e5;color:#9a5b00;}
.dscore{display:inline-block;font-family:'Bitter',serif;font-weight:800;font-size:22px;color:var(--red);}
.chips{padding:0 16px 6px;} .chip{display:inline-block;background:var(--chip);color:#2d3748;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;margin:2px 5px 2px 0;}
.sec{padding:10px 16px;border-top:1px solid var(--line);}
.sechd{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:7px;}
.fact{margin:5px 0;font-size:13px;} .fact .k{color:var(--mut);font-weight:600;display:inline-block;min-width:92px;}
.prow{display:flex;gap:9px;align-items:baseline;margin:4px 0;font-size:12.5px;}
.pbadge{flex:0 0 auto;font-family:'Bitter',serif;font-weight:800;color:var(--red);min-width:30px;}
.prow .pl{font-weight:600;} .prow .pn{color:var(--mut);}
.ground{background:#eafaf0;border:1px solid #b7e4c7;border-radius:8px;padding:9px 11px;font-size:12.5px;color:#155e34;margin:0 16px 10px;}
.intercept{font-size:12px;padding:5px 9px;margin-top:5px;background:#f0f9f4;border-left:3px solid #127a3a;border-radius:0 6px 6px 0;}
.prodbox{font-size:12px;background:#fbf6ef;border-left:3px solid #9a5b00;padding:6px 9px;border-radius:0 6px 6px 0;margin-top:6px;}
.dbtn{display:inline-block;background:var(--red);color:#fff;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:8px;margin:2px 16px 14px;} .dbtn:hover{text-decoration:none;opacity:.92;}
.legend{background:rgba(255,255,255,.95);padding:7px 9px;border-radius:8px;font-size:10.5px;line-height:1.5;border:1px solid var(--line);max-width:160px;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;}
.own{font-weight:600;color:var(--ink);}
.claimtip{font-size:11.5px;line-height:1.35;}
.drillctl button{font:600 12px/1 'Roboto',sans-serif;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12);}
.drillctl button.on{background:#ff7a00;color:#fff;border-color:#c85f00;}
@media(max-width:820px){#app{flex-direction:column;}#map{height:50%;}#side{width:100%;max-width:100%;height:50%;}}

// you pan/zoom. One geographic 0.5-deg tile set across every province.
let claimTileIdx=null, claimTileCache={}, claimTileLayer=null;
async function _claimTileIdx(){
  if(claimTileIdx) return claimTileIdx;
  try{ const r=await fetch('claimtiles/index.json'); claimTileIdx = r.ok ? await r.json() : {t:0.5,tiles:[]}; }
  catch(e){ claimTileIdx={t:0.5,tiles:[]}; }
  claimTileIdx._set = new Set(claimTileIdx.tiles||[]);
  return claimTileIdx;
}
async function drawClaimTiles(){
  const btn=document.getElementById('claimbtn');
  if(!claimsOn){ if(claimTileLayer){map.removeLayer(claimTileLayer);claimTileLayer=null;} return; }
  const idx=await _claimTileIdx(); const T=idx.t||0.5; const b=map.getBounds();
  const ix0=Math.floor(b.getWest()/T), ix1=Math.floor(b.getEast()/T);
  const iy0=Math.floor(b.getSouth()/T), iy1=Math.floor(b.getNorth()/T);
  const need=[];
  for(let ix=ix0;ix<=ix1;ix++){ for(let iy=iy0;iy<=iy1;iy++){ const k=ix+'_'+iy; if(idx._set.has(k)) need.push(k); } }
  if(btn) btn.textContent='⛏ Loading claims…';
  await Promise.all(need.map(async k=>{ if(claimTileCache[k]) return; try{ const r=await fetch('claimtiles/'+k+'.geojson'); claimTileCache[k]= r.ok? await r.json():{features:[]}; }catch(e){ claimTileCache[k]={features:[]}; } }));
  if(!claimsOn || map.getZoom()<8) return;            // view changed while loading
  if(claimTileLayer){map.removeLayer(claimTileLayer);claimTileLayer=null;}
  const feats=[], seen=new Set();   // render EVERY distinct claim polygon in view
  for(const k of need){ const d=claimTileCache[k]; if(!d) continue;
    for(const f of (d.features||[])){
      // Dedup only true cross-tile duplicates of the SAME polygon. The tenure id is
      // NOT unique per polygon in every province (Yukon cells share a claim number),
      // so key on id + the polygon's first vertex instead of id alone.
      let cc=f.geometry&&f.geometry.coordinates;
      try{ while(Array.isArray(cc[0])) cc=cc[0]; }catch(e){ cc=null; }
      const key=((f.properties&&f.properties.c)||'')+'@'+(cc?cc[0].toFixed(4)+','+cc[1].toFixed(4):String(seen.size));

    }

    renderer:claimRenderer,
    style:{color:'#2a1f00',weight:1,opacity:.95,fillColor:'#f4b400',fillOpacity:.5},

      if(tip.trim()) l.bindTooltip(tip,{sticky:true,direction:'top',className:'claimtip'}); }
  }).addTo(map);
  if(btn) btn.textContent = '⛏ Staked claims ('+shown+')';
}

async function showGround(p){
  clearOverlays();
  let bounds=null;
  try{
    const r=await fetch(p.region+'_opencells.geojson'); const d=await r.json();
    // the dissolved open-ground block(s) this lead belongs to (shared with any
    // neighbouring occurrence sitting in the same open ground)
    const fs=d.features.filter(f=>{const q=f.properties||{};return String(q.lead_id)===String(p.lead_id)||String(q.lead_ids||'').split(',').indexOf(String(p.lead_id))>=0;});
    if(fs.length){
      groundLayer=L.geoJSON({type:'FeatureCollection',features:fs},
        {interactive:false,style:{color:'#7a0050',weight:2,opacity:1,fillColor:'#ff2fbf',fillOpacity:.5}}).addTo(map);
      bounds=groundLayer.getBounds();
    }
  }catch(e){}
  // real neighbouring STAKED claims. Load every claim around this lead (up to
  // ~200 km) once, then draw whatever falls in the CURRENT map view as small gold
  // markers -- pan or zoom out and more staked ground appears, at any zoom. The
  // per-view draw is capped so a dense camp stays fast.
  const owners={}; let nearCount=0;
  try{
    const cr=await fetch(p.region+'_claims_near.geojson');
    if(cr.ok){
      const cd=await cr.json();
      const cpts=[];
      for(const f of (cd.features||[])){
        const g=f.geometry; if(!g) continue;
        let c=g.coordinates; while(Array.isArray(c)&&Array.isArray(c[0])) c=c[0];
        if(!(Array.isArray(c)&&c.length>=2)) continue;
        cpts.push({lat:c[1],lng:c[0],pr:f.properties||{}});
      }
      claimPts=cpts;
      // the real claim BLOCK polygons are drawn by the global viewport tile layer
      // (drawClaimTiles); here we only tally who holds the ground within ~50 km for
      // the "who's nearby" sidebar. No per-lead centroid squares anymore.
      drawClaims=null;
      const cphi=Math.cos(p.lat*Math.PI/180);
      for(const q of claimPts){
        const dk=Math.hypot((q.lat-p.lat)*111,(q.lng-p.lon)*111*cphi);
        if(dk<=50){ nearCount++; const own=(q.pr.owner||'').replace(/\s*-\s*100%$/,'').trim(); if(own) owners[own]=(owners[own]||0)+1; }
      }
      if(claimsOn) refreshClaims();
    }
  }catch(e){}
  // fill the "who's nearby" list in the sidebar detail
  const nb=document.getElementById('nearby');
  if(nb){
    const ranked=Object.keys(owners).sort((a,b)=>owners[b]-owners[a]);
    if(ranked.length){
      nb.innerHTML=`<div class=sechd>Who's nearby — ${ranked.length} holder(s) within ~50 km</div>`+
        ranked.slice(0,12).map(o=>`<div class=fact><span class=own>${esc(o)}</span> <span class=pn>${owners[o]} claim${owners[o]>1?'s':''}</span></div>`).join('')+
        `<div class=pn style="margin-top:5px">Hover any gold claim on the map for the holder and tenure number.</div>`;
    } else if(nearCount>0){
      nb.innerHTML=`<div class=sechd>Who's nearby — ${nearCount} claim(s) within ~50 km</div><div class=pn>Neighbouring ground is staked (shown in gold), but this jurisdiction's dataset doesn't publish holder names. Check the provincial registry for the current holders.</div>`;
    } else {
      nb.innerHTML=`<div class=sechd>Who's nearby</div><div class=pn>No active claims recorded within ~50 km — this ground looks open with no immediate neighbours.</div>`;
    }
  }
  if(bounds && bounds.isValid()){ map.fitBounds(bounds.pad(0.55)); }
  else { map.setView([p.lat,p.lon],12); }
}

      box.innerHTML=`<div class=sechd>Staked ground nearby</div>`+
        `<div class=fact><span class=k>Staked cells</span>${nearby} within ~${km} km</div>`+
        `<div class=pn style="margin-top:6px">These holes plot just off the mapped claim fabric, so we can't outline the driller's exact block — but this is what's staked around them (gold). ${info.publishes_holders?'Hover any cell for the holder and tenure.':esc(info.province||'This province')+" doesn't publish holders in bulk — check the provincial registry for who holds them."} Magenta cells (⛏ open ground) show what's open.</div>`;
    }
  }
}
function drillDetailHTML(rid){
  const pr=drillProg[rid]; if(!pr) return '';
  const g=v=>(v==null?'?':(''+v));
  const holesHTML=(pr.holes||[]).map(h=>{
    const main=(h.intervals||[]).filter(x=>!x.s).map(x=>`<div class=intercept>`+
      `${x.f!=null?g(x.f)+'–'+g(x.t)+' m':(g(x.l)+' m')} · <b>${g(x.g)} ${esc(x.u)} ${esc(x.e)}</b></div>`).join('');
    const subs=(h.intervals||[]).filter(x=>x.s).map(x=>`<div class=intercept style="opacity:.7;border-left-color:#8aa">`+
      `incl. ${x.f!=null?g(x.f)+'–'+g(x.t)+' m':(g(x.l)+' m')} · <b>${g(x.g)} ${esc(x.u)} ${esc(x.e)}</b></div>`).join('');
    const meta=[h.depth_m!=null?('depth '+g(h.depth_m)+' m'):'',h.azimuth!=null?('az '+g(h.azimuth)):'',h.dip!=null?('dip '+g(h.dip)):''].filter(Boolean).join(' · ');
    return `<div style="margin:8px 0 10px"><div style="font-weight:600;font-size:13px">Hole ${esc(h.hole)}</div>`+
      `${meta?('<div class=pn style="font-size:11.5px">'+meta+'</div>'):''}${main}${subs}`+
      `${(!main&&!subs)?'<div class=pn style="font-size:11.5px">No assays reported for this hole.</div>':''}</div>`;
  }).join('');
  const nh=(pr.holes||[]).length;
  return `<div class="dback" onclick="deselect()">← All opportunities</div>
    <div class=dhd><span class=dn>${esc(pr.company||'Drill program')}</span>
      <span class="pill p-open">⛏ drill result</span>
      <div class=dsub>${esc(pr.region||'')}${pr.date?(' · '+esc(pr.date)):''}${pr.project?(' · '+esc(pr.project)):''}</div></div>
    <div class=sec id=coclaims><div class=sechd>Company ground</div><div class=pn>Loading the company's claims…</div></div>
    <div class=sec><div class=sechd>⛏ Drill results — ${nh} hole(s)</div>${holesHTML||'<div class=pn>No holes located.</div>'}</div>
    ${pr.url?`<a class=dbtn href="${esc(pr.url)}" target=_blank>Full release ↗</a>`:''}`;
}
async function selectDrill(rid){
  if(!drillProg[rid]) await loadDrill();
  if(!drillProg[rid]) return;
  selRid=rid; selId=null;
  clearOverlays();
  document.querySelectorAll('.row.sel').forEach(r=>r.classList.remove('sel'));
  document.getElementById('list').style.display='none';
  document.getElementById('cnt').style.display='none';
  const det=document.getElementById('detail'); det.style.display='block'; det.innerHTML=drillDetailHTML(rid); det.scrollTop=0;
  if(!drillOn) showDrill(true);
  await showProgramGround(rid);
  await showCompanyClaims(rid);   // runs last so the property extent frames the view
}
const drillCtl=L.control({position:'topright'});
drillCtl.onAdd=()=>{const d=L.DomUtil.create('div','drillctl');
  d.innerHTML='<button id=drillbtn>⛏ Drill results</button>';
  L.DomEvent.disableClickPropagation(d);
  d.querySelector('button').onclick=()=>showDrill(!drillOn); return d;};
drillCtl.addTo(map);

// ---- deep-link: center on a point from the daily radar / email and, if a lead
// sits right there, open it; otherwise drop a labelled pin so the spot is obvious
(function(){
  const q=new URLSearchParams(location.search);
  const lat=parseFloat(q.get('lat')), lon=parseFloat(q.get('lon'));
  const region=(q.get('region')||'').toLowerCase();
  if(isNaN(lat)||isNaN(lon)){
    // no specific point — if a region was named, frame that region's leads, but
    // leave EVERY Canadian lead on the map so you can just zoom out to see them all
    if(region){
      const pts=LEADS.filter(p=>p.region===region).map(p=>[p.lat,p.lon]);
      if(pts.length){ try{ map.fitBounds(pts,{padding:[40,40],maxZoom:8}); }catch(e){} }
    }
    return;
  }
  const z=parseInt(q.get('z'))||12, kind=q.get('kind')||'', label=q.get('label')||'';
  try{ map.invalidateSize(); }catch(e){}   // size the map before any fitBounds
  if(kind==='drill'){ map.setView([lat,lon], z); showDrill(true).then(async ()=>{
      let brid=null,bd=1e9;   // the program (release) whose holes are nearest
      Object.keys(drillByRid).forEach(rid=>drillByRid[rid].forEach(ll=>{
        const dd=Math.hypot(ll[0]-lat,ll[1]-lon); if(dd<bd){bd=dd;brid=rid;}}));
      if(!brid && label){        // no geolocated holes at this point — match the program by company/project name
        const lc=label.toLowerCase();
        brid=Object.keys(drillProg).find(rid=>(((drillProg[rid].company||'')+' '+(drillProg[rid].project||'')).toLowerCase().includes(lc)))||null;
      }
      if(brid){ await selectDrill(brid); }
      else { L.circleMarker([lat,lon],{radius:9,color:'#fff',weight:2,fillColor:'#ff7a00',fillOpacity:.95}).addTo(map)
              .bindPopup(`<b>${(label||'Drill program').replace(/[<>]/g,'')}</b><br><span style="color:#555">Collar coordinates weren\'t published in this release, so there are no hole pins — open the release for the drill section.</span>`).openPopup(); }
      // fitBounds during async load can land at world zoom when the map container
      // isn't sized yet — recompute size and re-assert a sane view on the play.
      setTimeout(()=>{ try{ map.invalidateSize(); if(map.getZoom()<8) map.setView([lat,lon], Math.max(z,12)); }catch(e){} }, 300);
    }); return; }
  // nearest lead to the target (match a radar item to its lead card)
  let best=null, bd=1e9;
  LEADS.forEach(p=>{const d=Math.hypot((p.lat-lat)*111,(p.lon-lon)*111*Math.cos(lat*Math.PI/180));
    if(d<bd){bd=d;best=p;}});
  map.setView([lat,lon], z);
  if(best && bd<1.2){ select(best.id); return; }   // a lead is right here — open it
  // otherwise mark the spot (dropped ground / drill play with no lead card)
  const c=kind==='drop'?'#0f766e':(kind==='edge'?'#D71920':'#334155');
  const pin=L.circleMarker([lat,lon],{radius:9,color:'#fff',weight:2,fillColor:c,fillOpacity:.95}).addTo(map);
  pin.bindPopup(`<b>${(label||'Location').replace(/[<>]/g,'')}</b>`+
    (kind==='drop'?'<br>Dropped ground — freshly stakeable':kind==='edge'?'<br>Fresh drill play':'')).openPopup();
  // show open ground + claims context here even without a lead selected
  showGround({region:(q.get('region')||'').toLowerCase(), lead_id:'__none__', lat:lat, lon:lon});
})();
</script></body></html>
