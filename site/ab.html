<style>
:root{ --red:#D71920; --ink:#111418; --mut:#636363; --line:#e6e8eb; --panel:#f5f7fa; --bg:#ffffff; --chip:#EDF2F7; }
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Roboto',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.55;}
h1,h2,h3,h4{font-family:'Bitter',Georgia,serif;font-weight:700;color:var(--ink);margin:0;}
a{color:var(--red);text-decoration:none;} a:hover{text-decoration:underline;}
.topbar{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:50;}
.topwrap{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 22px;gap:20px;flex-wrap:wrap;}
.brand{display:flex;flex-direction:column;gap:3px;text-decoration:none;}
.brand img{height:30px;width:auto;display:block;}
.brand .sub{font-family:'Bitter',serif;font-weight:700;font-size:11px;letter-spacing:2.5px;color:var(--ink);text-transform:uppercase;}
nav.menu{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
nav.menu a,nav.menu .dd>a.ddlabel{display:inline-flex;align-items:center;height:32px;color:var(--ink);font-size:14px;font-weight:500;line-height:1;border-bottom:2px solid transparent;text-decoration:none;}
nav.menu a:hover{color:var(--red);text-decoration:none;}
nav.menu a.active{color:var(--red);border-bottom-color:var(--red);}
nav.menu .dd{position:relative;display:inline-flex;align-items:center;}
nav.menu .dd>a.ddlabel::after{content:"";display:inline-block;width:0;height:0;margin-left:6px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--mut);}
nav.menu .dd:hover>a.ddlabel::after{border-top-color:var(--red);}
nav.menu .dd:hover>a.ddlabel,nav.menu .dd>a.ddlabel.active{color:var(--red);}
nav.menu .dd-menu{display:none;position:absolute;top:100%;left:0;padding-top:8px;min-width:230px;z-index:60;}
nav.menu .dd:hover .dd-menu{display:block;}
nav.menu .dd-menu .inner{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.10);padding:6px 0;}
nav.menu .dd-menu a{display:block;padding:7px 15px;font-size:13.5px;color:var(--ink);border:0;white-space:nowrap;}
nav.menu .dd-menu a:hover{background:var(--panel);color:var(--red);text-decoration:none;}
.wrap{max-width:1180px;margin:0 auto;padding:26px 22px 60px;}
.hero h1{font-size:30px;letter-spacing:-.3px;} .hero p{color:var(--mut);max-width:760px;}
.rule{height:3px;width:52px;background:var(--red);margin:10px 0 0;border-radius:2px;}
footer.site{border-top:1px solid var(--line);color:var(--mut);font-size:12px;line-height:1.6;padding:22px;max-width:1180px;margin:0 auto;}
footer.site b{color:var(--ink);}
</style>
<style>
  :root { --bg:#ffffff; --panel:#f5f7fa; --line:#e6e8eb; --ink:#111418; --mut:#636363; --accent:#D71920; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:'Roboto',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--ink); }
  body { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  #app { display:flex; flex:1; min-height:0; overflow:hidden; }
  #map { flex:1; height:100%; }
  #panel { width:460px; background:#fff; border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  #panel > header { padding:12px 15px; border-bottom:1px solid var(--line); }
  #panel header h1 { margin:0 0 2px; font-size:15px; font-family:'Bitter',serif; } #panel header .sub { color:var(--mut); font-size:11.5px; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:10px 15px; border-bottom:1px solid var(--line); }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:6px; }
  .stat b { display:block; font-size:15px; font-family:'Bitter',serif; } .stat span { color:var(--mut); font-size:9px; text-transform:uppercase; letter-spacing:.3px; }
  .controls { padding:8px 15px; border-bottom:1px solid var(--line); font-size:11.5px; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; }
  .chip { padding:2px 7px; border-radius:20px; border:1px solid var(--line); cursor:pointer; font-size:10.5px; display:flex; align-items:center; gap:4px; background:#fff; }
  .chip .dot { width:8px; height:8px; border-radius:50%; } .chip.off { opacity:.35; }
  .controls .row { display:flex; gap:10px; align-items:center; color:var(--mut); flex-wrap:wrap; }
  .controls label { display:flex; gap:4px; align-items:center; cursor:pointer; }
  #leadlist { flex:1; overflow:auto; }
  table { width:100%; border-collapse:collapse; font-size:11.5px; }
  th,td { padding:6px 8px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }
  th { position:sticky; top:0; background:var(--panel); color:var(--mut); font-weight:700; font-size:10px; text-transform:uppercase; cursor:pointer; white-space:nowrap; }
  th.sorted::after { content:" \25BE"; }
  tbody tr { cursor:pointer; } tbody tr:hover { background:#fdeaea; }
  .lead-name { font-weight:700; }
  .sub2 { color:var(--mut); font-size:10px; margin-top:2px; line-height:1.4; }
  .drill { color:#047857; font-size:10px; margin-top:3px; line-height:1.4; }
  .metal-chip { font-size:9px; padding:0 4px; border-radius:4px; color:#fff; font-weight:700; margin-left:4px; }
  .badge { font-size:8.5px; padding:1px 4px; border-radius:4px; font-weight:700; margin-left:4px; }
  .b-dep { background:#e7f6ec; color:#127a3a; } .b-hard { background:#fff4e5; color:#9a5b00; }
  .score-pill { display:inline-block; min-width:26px; text-align:center; padding:2px 5px; border-radius:20px; font-weight:700; color:#fff; background:var(--accent); }
  footer { padding:8px 15px; font-size:9.5px; color:var(--mut); border-top:1px solid var(--line); line-height:1.4; }
  .leaflet-popup-content { font-size:12px; line-height:1.5; max-width:300px; }
  .leaflet-popup-content b { color:#111; } .pk { color:#64748b; }
  .cells { max-height:70px; overflow:auto; background:#f1f5f9; border:1px solid #cbd5e1; border-radius:4px; padding:3px 5px; margin-top:3px; font-family:ui-monospace,monospace; font-size:10.5px; color:#0b1526; }
  .legend { background:rgba(255,255,255,.95); color:var(--ink); padding:8px 10px; border-radius:8px; font-size:10.5px; line-height:1.55; border:1px solid var(--line); max-width:175px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  .legend i { display:inline-block; width:10px; height:10px; margin-right:5px; border-radius:3px; vertical-align:-1px; }
  #detail { flex:1; overflow:auto; display:none; }
  .dback { position:sticky; top:0; background:#fff; border-bottom:1px solid var(--line); padding:9px 15px; font-size:13px; font-weight:600; color:var(--accent); cursor:pointer; z-index:2; }
  .dhd { padding:13px 16px 4px; } .dscore { font-family:'Bitter',serif; font-weight:800; font-size:22px; color:var(--accent); }
  .dhd .dn { font-family:'Bitter',serif; font-weight:800; font-size:19px; margin-left:6px; }
  .dpill { font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; margin-left:6px; vertical-align:middle; }
  .p-open { background:#e7f6ec; color:#127a3a; } .p-hard { background:#fff4e5; color:#9a5b00; }

} else {
  claimsLayer=L.geoJSON(CLAIMS,{style:{color:'#64748b',weight:.8,fillColor:'#64748b',fillOpacity:0.18},
    onEachFeature:(f,l)=>l.bindPopup(`<b>Claim ${esc(f.properties.claim)}</b><br>Active mining claim cell<br><a href="https://www.mlas.mndm.gov.on.ca/mlas/search/searchIndex.html#/search/searchClaimDetails?claimNumber=${esc(f.properties.claim)}" target=_blank>View in MLAS ↗</a>`)});
  claimsLayer.addTo(map);
}

// --- open stakeable cells (the ground to stake) ---
const cellLayer=L.geoJSON(CELLS,{style:{color:'#7a0050',weight:2,fillColor:'#ff2fbf',fillOpacity:0.5},
  onEachFeature:(f,l)=>l.bindPopup(`<b>Open cell</b> — beside #${f.properties.rank} ${esc(f.properties.name)}<br>Appears unstaked &amp; stakeable. Verify before acting.`)}).addTo(map);

// --- occurrences: clustered ---
const SC={'Producer':'#7f1d1d','Producing Mine':'#7f1d1d','Past Producer':'#dc2626','Past Producing Mine':'#dc2626','Past Producing Mine (Low Tonnage)':'#e0562c','Developed Prospect':'#ea580c','Prospect':'#f59e0b','Deposit':'#eab308','Showing':'#38bdf8','Occurrence':'#94a3b8'};
const occCluster=L.markerClusterGroup({chunkedLoading:true,maxClusterRadius:45,disableClusteringAtZoom:11});
L.geoJSON(OCC,{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:4,color:'#0b1526',weight:.7,fillColor:SC[(f.properties.st||'').trim()]||'#94a3b8',fillOpacity:f.properties.p?0.95:0.6}),
  onEachFeature:(f,l)=>{const p=f.properties; l.bindPopup(`<b>${esc(p.n)}</b> <span class=pk>${esc(p.mf)}</span><br><b>${esc(p.c)}</b><br>${esc(p.st)}${p.p?' · produced':''}<br>${p.u?`<a href="${esc(p.u)}" target=_blank>record ↗</a>`:''}`);}
}).addTo(occCluster);
occCluster.addTo(map);

// --- leads ---
const leadMarkers={};
const leadsLayer=L.geoJSON(LEADS,{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:7,color:'#0b1526',weight:1.3,fillColor:mc(f.properties.primary_metal),fillOpacity:0.92}),
  onEachFeature:(f,l)=>{const p=f.properties; leadMarkers[p.lead_id]=l; l.on('click',()=>select(p.lead_id));}
}).addTo(map);

// full detail in the sidebar (not a cramped popup) when a lead is clicked
function detailHTML(p){
  const facts=[];
  facts.push(`<div class=fact><span class=k>Commodities</span>${esc(p.commodity)}</div>`);
  facts.push(`<div class=fact><span class=k>Status</span>${esc(p.status)}</div>`);
  if(p.grade_str) facts.push(`<div class=fact><span class=k>Grade</span>${esc(p.grade_str)}</div>`);
  if(p.deposit_size&&p.deposit_size!=='no tonnage on record') facts.push(`<div class=fact><span class=k>Size</span>${esc(p.deposit_size)}</div>`);
  if(p.exploration_spend_str) facts.push(`<div class=fact><span class=k>Expl. spend</span>${esc(p.exploration_spend_str)}${p.n_reports?` · ${p.n_reports} report(s)`:''}${p.last_work_year?` · last ${p.last_work_year}`:''}</div>`);
  if(p.operators) facts.push(`<div class=fact><span class=k>Operators</span>${esc(p.operators)}</div>`);
  facts.push(`<div class=fact><span class=k>Nearest town</span>${esc(p.nearest_community)}${p.community_km!=null?` · ${p.community_km} km`:''}</div>`);
  return `<div class=dback onclick="deselect()">← All leads</div>
    <div class=dhd><span class=dscore>${p.score}</span><span class=dn>${esc(p.name)}</span>
      <span class=dpill style="background:${mc(p.primary_metal)}22;color:${mc(p.primary_metal)}">${esc(p.primary_metal)}</span>
      ${p.deposit_open?'<span class="dpill p-open">deposit open</span>':''}${p.hard_to_stake?'<span class="dpill p-hard">harder to stake</span>':''}
      <div class=dsub>${esc(p.minfile||'')}</div></div>
    ${p.n_cells?`<div class=dground>◎ <b>Stakeable ground</b> — ${p.n_cells} open cell(s), ~${p.cells_area_ha} ha ${p.deposit_open?'on and around the deposit':'adjacent'}. Shown in magenta on the map, carved around existing claims (gold/grey). Verify in the official registry before staking.</div>`:''}
    <div class=dsec><div class=h>Qualifying details</div>${facts.join('')}
      ${p.drill_highlights?`<div class=h style="margin-top:10px">⛏ Drill / assay</div><div class=drillbox>${esc(p.drill_highlights)}</div>`:''}
      ${p.encumbrances?`<div class=prodbox><b>⚠ Harder to stake.</b> ${esc(p.encumbrances)}</div>`:''}</div>
    ${p.minfile_url?`<a class=dbtn href="${esc(p.minfile_url)}" target=_blank>Full record ↗</a>`:''}`;
}
let selId=null;
function select(id){
  const f=LEADS.features.find(x=>x.properties.lead_id===id); if(!f) return;
  const p=f.properties; selId=id;
  document.getElementById('leadlist').style.display='none';
  document.querySelector('.controls').style.display='none';
  const det=document.getElementById('detail'); det.style.display='block'; det.innerHTML=detailHTML(p); det.scrollTop=0;
  const l=leadMarkers[id]; if(l){ map.setView(l.getLatLng(), Math.max(map.getZoom(),13)); }
}
function deselect(){
  selId=null;
  document.getElementById('detail').style.display='none';
  document.getElementById('leadlist').style.display='block';
  document.querySelector('.controls').style.display='block';
}
try{map.fitBounds(leadsLayer.getBounds().pad(0.05));}catch(e){map.setView([50,-86],5);}
L.control.layers({'Topographic':topo,'Street':osm},{},{position:'topleft'}).addTo(map);

// deep link from the priority page: <region>.html?lat=..&lon=..&lead=L0007
(function(){
  const q=new URLSearchParams(location.search);
  const lat=parseFloat(q.get('lat')), lon=parseFloat(q.get('lon')), lead=q.get('lead');
  if(isFinite(lat)&&isFinite(lon)){ map.setView([lat,lon],12);
    if(lead&&leadMarkers[lead]){ setTimeout(()=>select(lead),300); } }
})();

document.getElementById('subline').textContent=`Updated ${STATS.generated} · magenta = open stakeable ground · click any lead for full detail`;
document.getElementById('attribution').textContent=STATS.attribution;
const S=[['n_leads','Stakeable leads'],['n_with_spend','With expl. spend'],['n_with_drill_highlights','Drill data'],['n_hard_to_stake','Harder stake'],['n_candidate_leads','Candidates'],['n_occurrences','Occurrences'],['n_claims_active','Claims'],['top_n_examined','Examined']];
document.getElementById('stats').innerHTML=S.map(([k,l])=>`<div class=stat><b>${(STATS[k]!=null&&STATS[k].toLocaleString)?STATS[k].toLocaleString():(STATS[k]??'—')}</b><span>${l}</span></div>`).join('');

function buckets(p){let m=p.metal_buckets;if(Array.isArray(m))return m;return (m||p.primary_metal||'').split(';').filter(Boolean);}
const present=[]; LEADS.features.forEach(f=>buckets(f.properties).forEach(m=>{if(!present.includes(m))present.push(m);}));
present.sort((a,b)=>METAL_ORDER.indexOf(a)-METAL_ORDER.indexOf(b));
const selected=new Set(present);
const chipsEl=document.getElementById('metalChips');
chipsEl.innerHTML=present.map(m=>`<span class="chip" data-m="${m}"><span class=dot style="background:${mc(m)}"></span>${m}</span>`).join('');
chipsEl.addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;const m=c.dataset.m;selected.has(m)?(selected.delete(m),c.classList.add('off')):(selected.add(m),c.classList.remove('off'));render();});

const rowsEl=document.getElementById('leadrows'); let sortK='rank',sortAsc=true;
function passes(p){
  if(document.getElementById('fDrill').checked && !(p.drill_highlights)) return false;
  return buckets(p).some(m=>selected.has(m));
}
function render(){
  let list=LEADS.features.map(f=>f.properties).filter(passes);
  list.sort((a,b)=>{let x=a[sortK],y=b[sortK];if(sortK==='name'||sortK==='tonnes_str'){x=x||'';y=y||'';return sortAsc?String(x).localeCompare(y):String(y).localeCompare(x);}x=x==null?-1:x;y=y==null?-1:y;return sortAsc?x-y:y-x;});
  rowsEl.innerHTML=list.map(p=>{
    const dh=p.drill_highlights?`<div class=drill>⛏ ${esc(p.drill_highlights.slice(0,110))}${p.drill_highlights.length>110?'…':''}</div>`:'';
    return `<tr data-id="${p.lead_id}"><td>${p.rank}</td>
      <td><span class=lead-name>${esc(p.name)}</span><span class=metal-chip style="background:${mc(p.primary_metal)}">${esc(p.metals_abbr||p.primary_metal)}</span>
        ${p.deposit_open?'<span class="badge b-dep">◎ open</span>':''}${p.hard_to_stake?'<span class="badge b-hard">⚠ process</span>':''}
        <div class=sub2>${esc(p.nearest_community)} · ${p.community_km} km · ${esc(p.basis)}</div>${dh}</td>
      <td>${esc((p.deposit_size||'').replace('no tonnage on record','—').slice(0,22))}</td>
      <td><span class=score-pill style="background:${mc(p.primary_metal)}">${p.score}</span></td></tr>`;}).join('');
  document.querySelectorAll('th[data-k]').forEach(th=>th.classList.toggle('sorted',th.dataset.k===sortK));
  LEADS.features.forEach(f=>{const p=f.properties,l=leadMarkers[p.lead_id];if(!l)return;passes(p)?(map.hasLayer(l)||l.addTo(leadsLayer)):leadsLayer.removeLayer(l);});
}
rowsEl.addEventListener('click',e=>{const tr=e.target.closest('tr');if(!tr)return;if(tr.dataset.id)select(tr.dataset.id);});
document.querySelectorAll('th[data-k]').forEach(th=>th.addEventListener('click',()=>{const k=th.dataset.k;sortAsc=(k===sortK)?!sortAsc:(k==='rank'||k==='name');sortK=k;render();}));
document.getElementById('fDrill').addEventListener('change',render);
document.getElementById('tClaims').addEventListener('change',e=>{e.target.checked?claimsLayer.addTo(map):map.removeLayer(claimsLayer);});
document.getElementById('tCells').addEventListener('change',e=>{e.target.checked?cellLayer.addTo(map):map.removeLayer(cellLayer);});
document.getElementById('tOcc').addEventListener('change',e=>{e.target.checked?occCluster.addTo(map):map.removeLayer(occCluster);});

const legend=L.control({position:'bottomleft'});
legend.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML='<b>Leads by metal</b><br>'+present.map(m=>`<i style="background:${mc(m)}"></i>${m}`).join('<br>')+'<br><i style="background:#ff2fbf;border:1px solid #7a0050"></i>Open stakeable ground<br><i style="background:#64748b"></i>Active claim';return d;};
legend.addTo(map);
render();
</script></body></html>
